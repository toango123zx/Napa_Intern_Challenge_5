<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/scrollreveal"></script>

    <link rel="stylesheet" href="./scss/main.css">

    <title>Signin</title>
</head>

<body class="auth signin">
    <div class="wrap">
        <div class="auth__background scroll">
            <img src="./assets/image/backgroundSignIn.jpg" alt="backgroundSignIn">
            <div class="auth__background--blur"></div>
        </div>
        <div class="auth__container">
            <div class="header scroll">
                <button>
                    <img src="./assets/icon/iconHouse.png" alt="iconHouse">
                    <p>Go to Home</p>
                </button>
            </div>
            <div class="box-container scroll--bottom">
                <div class="logo">
                    <img src="./assets/icon/iconLogo.png" alt="iconLogo">
                    <h6>Dashcraft</h6>
                </div>
                <div class="content">
                    <div class="content__container">
                        <div class="content__title">
                            <h6>Please log in to your account</h6>
                            <p>Welcome back! Please sign in using your credentials.</p>
                        </div>
                        <div class="content__input">
                            <div class="input">
                                <h6>Email</h6>
                                <input type="email" placeholder="name@gmail.com" id="email">
                            </div>
                            <div class="input">
                                <h6>Password</h6>
                                <input type="password" placeholder="*********" id="password">
                            </div>
                        </div>
                        <div class="content__button">
                            <button class="content__button--submit" onclick="signin()">Sign In</button>
                            <button class="content__button--social">
                                <img src="./assets/icon/logoGoogle.png" alt="logoGoogle">
                                <p>Sign in with Google</p>
                            </button>
                        </div>
                    </div>
                    <div class="content__link">
                        <span>Don't have an account?</span>
                        <span><a href="./signup.html">Sign up</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/signin.js"></script>
    <script type="text/javascript">
        ScrollReveal().reveal('.scroll', {
            delay: 200,
            duration: 400,
            easing: 'ease-in-out',
            opacity: 0
        });

        ScrollReveal().reveal('.scroll--bottom', {
            delay: 200,
            distance: '50px',
            origin: 'bottom',
            duration: 400,
            easing: 'ease-in-out',
            opacity: 0
        });
        const test = async () => {
            alert('Hello');
        }

    </script>
</body>

</html>
